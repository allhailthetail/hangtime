[package]
name = "hangtime"
description = "DMR-style push-to-talk voice comms between computers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
crossterm = "0.29"
hangtime-audio.workspace = true
hangtime-discovery.workspace = true
hangtime-identity.workspace = true
hangtime-proto.workspace = true
hangtime-session.workspace = true
hangtime-transport.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
