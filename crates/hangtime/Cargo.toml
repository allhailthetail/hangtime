[package]
name = "hangtime"
description = "DMR-style push-to-talk voice comms between computers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
crossterm = "0.29"
hangtime-audio.workspace = true
hangtime-identity.workspace = true
hangtime-proto.workspace = true
hangtime-session.workspace = true
hangtime-transport.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
